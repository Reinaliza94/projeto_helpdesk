{% extends "base.html" %}

{% block titulo %}
Cadastro de Usuário
{% endblock %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/cadastro.css') }}">
{% endblock %}

{% block conteudo %}

<h1>Cadastro de Usuário</h1>

{% if erro_cadastro %}
<div class="erro-cadastro" role="alert">{{ erro_cadastro }}</div>
{% endif %}

<form action="{{ url_for('cadastro_usuario') }}" method="POST">

    <div> 
        <label for="nome">Nome</label>
        <input type="text" name="nome" maxlength="200" required value="{{ request.form.nome }}">
    </div>

    <div>
        <label for="email">E-mail</label>
        <input type="email" name="email" maxlength="50" required value="{{ request.form.email }}">
    </div>

    <div>
        <label for="senha">Senha</label>
        <input type="password" name="senha" maxlength="100" required>
    </div>

    <div>
        <label for="departamento"> Departamento</label>
        <input type="text" name="departamento" maxlength="200" required value="{{ request.form.departamento }}">
    </div>

    <div>
        <label for="ramal">Ramal</label>
        <input type="number" name="ramal" maxlength="15" value="{{ request.form.ramal }}">
    </div>

    <div>
        <label for="status">Status</label>
        <select
        id="status"
        name="status"
        required
    >
        <option value="">
            Selecione o status
        </option>

        <option value="Ativo">
            Ativo
        </option>

        <option value="Inativo">
            Inativo
        </option>
        </select>    
    </div>

    <button>
        Cadastrar Usuário
    </button>

</form>

{% endblock %}
