{% extends "base.html" %}

{% block titulo %}
Cadastro de Chamado
{% endblock %}

{% block css %}
<link rel="stylesheet"href="{{ url_for('static', filename='css/cadastro.css') }}">
{% endblock %}

{% block conteudo %}

<h1>Cadastro de Chamado</h1>

<form action="{{ url_for('cadastro_chamado') }}" method="POST">

<div>
    <label for="titulo">Título:</label>

    <input type="text" id="titulo" name="titulo" maxlength="200" required>
</div>


<div>
    <label for="descricao">Descrição:</label>

    <textarea
        id="descricao"
        name="descricao"
        maxlength="500"
        required
    ></textarea>
</div>


<div>
    <label for="status">Status:</label>

    <select
        id="status"
        name="status"
        required
    >
        <option value="">
            Selecione o status
        </option>

        <option value="Aberto">
            Aberto
        </option>

        <option value="Em andamento">
            Em andamento
        </option>

        <option value="Fechado">
            Fechado
        </option>
    </select>
</div>


<div>
    <label for="prioridade">Prioridade:</label>

    <select
        id="prioridade"
        name="prioridade"
        required
    >
        <option value="">
            Selecione a prioridade
        </option>

        <option value="Baixa">
            Baixa
        </option>

        <option value="Média">
            Média
        </option>

        <option value="Alta">
            Alta
        </option>
    </select>
</div>


<div>
    <label for="categoria">Categoria:</label>

    <input
        type="text"
        id="categoria"
        name="categoria"
        maxlength="100"
        required
    >
</div>


<div>
    <label for="id_usuario">ID do Usuário:</label>

    <input
        type="number"
        id="id_usuario"
        name="id_usuario"
        min="1"
        required
    >
</div>


<div>
    <label for="responsavel_tecnico">
        Responsável Técnico:
    </label>

    <input
        type="text"
        id="responsavel_tecnico"
        name="responsavel_tecnico"
        maxlength="200"
    >
</div>


<button type="submit">
    Cadastrar Chamado
</button>


</form>

{% endblock %}
